[project]
name = "droughtproject"
version = "0.2.0"
description = "Reproducible monthly rainfall and SPI forecasting reference pipeline for Marrakech"
readme = "README.md"
authors = [
    { name = "Langost", email = "a.boustari1296@uca.ac.ma" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
